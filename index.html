async function sha(t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function decode(s){const bin=atob(s),bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return new TextDecoder().decode(bytes)}
async function go(){
  const v=document.getElementById("pw").value.trim();
  if(!v)return;
  if(await sha(v)!==HASH){document.getElementById("err").textContent="密码不对，请找分享人核对";return}
  const f=document.getElementById("frame");
  f.srcdoc=decode(B64);
  document.getElementById("gate").style.display="none";
  f.style.display="block";
  document.title="计划书追踪 · 原型";
}
document.getElementById("go").addEventListener("click",go);
document.getElementById("pw").addEventListener("keydown",e=>{if(e.key==="Enter")go()});
